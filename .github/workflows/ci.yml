# Checks every app, then builds each one's debug APK; checks every site on
# gd-chime for the web, and publishes the sites to GitHub Pages from main.
#
# The same tools run locally: tooling/install.py, tooling/check_app.py,
# tooling/export_android.py; tooling/install_site.py, tooling/check_site.py,
# tooling/export_web.py. Godot's version comes from dependencies.json.

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A main run publishes APKs to debug-latest; cancelling it halfway would leave
  # the release with some new APKs and some old ones. Branches can be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      godot: ${{ steps.pins.outputs.godot }}
    steps:
      - uses: actions/checkout@v7

      - name: Read pins
        id: pins
        # an assignment, so a failure stops the step rather than passing on an empty version
        run: |
          godot=$(python3 -c "import json; print(json.load(open('dependencies.json'))['godot']['version'])")
          test -n "$godot"
          echo "godot=$godot" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ steps.pins.outputs.godot }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.pins.outputs.godot }}
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${VERSION}_linux.x86_64 ~/godot/godot

      - name: Tooling tests
        run: python3 -m unittest discover -s tooling/tests -v

      - name: Install dependencies
        run: python3 tooling/install.py

      - name: Check apps
        run: python3 tooling/check_app.py --godot ~/godot/godot

      # A new app must pass its checks as create_app makes it, with no hand edits.
      - name: Check a freshly created app
        run: |
          python3 tooling/create_app.py ci_scratch
          python3 tooling/install.py ci_scratch
          python3 tooling/check_app.py ci_scratch --godot ~/godot/godot

      # No app installs the backend yet: check it, tests and all, in a fresh one.
      - name: Check the backend service in a fresh app
        run: |
          python3 tooling/create_app.py ci_backend
          python3 -c "import json, pathlib; p = pathlib.Path('apps/ci_backend/factory.json'); d = json.loads(p.read_text()); d['services'].append('backend'); p.write_text(json.dumps(d))"
          python3 tooling/install.py ci_backend
          python3 tooling/check_app.py ci_backend --godot ~/godot/godot

  # The shared server's set-up (platform/): it only runs on the real
  # machine, so its parts are checked here before anyone orders one.
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Shell scripts
        run: shellcheck -x platform/setup.sh platform/bootstrap.sh platform/tenants/*.sh platform/bin/* platform/checks/*.sh

      - name: Deploying itself (bin/deploy, against a stand-in machine)
        run: bash platform/checks/test_deploy.sh

      - name: First-boot file
        run: python3 -c "import yaml; d = yaml.safe_load(open('platform/cloud-init.yaml')); assert d['runcmd'] and d['write_files']"

      - name: Steam sign-in
        run: node --test platform/functions/steam-signin/steam.test.ts

      - name: Apps' tables hold the platform's rules
        run: |
          python3 platform/checks/test_app_sql_check.py
          python3 platform/checks/app_sql_check.py

      - name: The platform's and apps' tables in a real PostgreSQL
        run: bash platform/checks/test_sql.sh

      - name: Supabase's compose file with the factory's changes
        run: |
          tag=$(sed -n 's/^SUPABASE_TAG=//p' platform/setup.sh)
          git clone -q --depth 1 --filter=blob:none --sparse --branch "$tag" https://github.com/supabase/supabase /tmp/supabase
          git -C /tmp/supabase sparse-checkout set docker
          cd /tmp/supabase/docker
          cp .env.example .env
          sed -i "s|^COMPOSE_FILE=.*|COMPOSE_FILE=docker-compose.yml:$GITHUB_WORKSPACE/platform/supabase/platform.yml|" .env
          printf 'PLATFORM_DOMAIN=example.test\nPLATFORM_DIR=/tmp/platform\n' >> .env
          docker compose config --format json | python3 "$GITHUB_WORKSPACE/platform/checks/compose_check.py"

      - name: The one open door (Caddyfile)
        run: |
          mkdir -p /tmp/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=ci -keyout /tmp/tls/origin.key -out /tmp/tls/origin.pem
          cp /tmp/tls/origin.pem /tmp/tls/cloudflare-origin-pull-ca.pem
          cp /tmp/tls/origin.pem /tmp/tls/play-origin.pem
          cp /tmp/tls/origin.key /tmp/tls/play-origin.key
          image=$(sed -n 's/^    image: \(caddy:.*\)/\1/p' platform/supabase/platform.yml)
          # play. on the platform's own domain, and on a domain of its own
          for play in "example.test origin" "example-play.test play-origin"; do
            set -- $play
            docker run --rm -e DOMAIN=example.test -e PLAY_DOMAIN="$1" -e PLAY_CERT="$2" -v "$PWD/platform/supabase/Caddyfile:/etc/caddy/Caddyfile:ro" -v /tmp/tls:/tls:ro "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

  android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # to publish the debug-latest pre-release
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot and Android templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ needs.check.outputs.godot }}-linux-android

      - name: Download Godot and Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ needs.check.outputs.godot }}
        run: |
          mkdir -p ~/godot
          base="https://github.com/godotengine/godot/releases/download/${VERSION}"
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${VERSION}_linux.x86_64 ~/godot/godot
          # Only the Android templates: the full set is several times larger.
          templates=~/.local/share/godot/export_templates/${VERSION/-/.}
          mkdir -p "$templates"
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${VERSION}_export_templates.tpz"
          unzip -jq /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d "$templates"
          rm /tmp/templates.tpz

      - name: Install dependencies
        run: python3 tooling/install.py

      - name: Export debug APKs
        # ANDROID_HOME and JDK 17 come with the runner image.
        run: JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}" python3 tooling/export_android.py --godot ~/godot/godot

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30

      # A fixed link a phone can open without signing in:
      # https://github.com/<repo>/releases/download/debug-latest/<app>-debug.apk
      - name: Publish to the debug-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=debug-latest
          notes="Debug builds from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}, $(date -u '+%Y-%m-%d %H:%M UTC'). Signed with the shared debug key: install by sideloading; not for the Play Store."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "Debug builds" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" build/*.apk --clobber
          gh release edit "$tag" --notes "$notes"

  # Sites: web apps on gd-chime for the web (web/gd_chime/), each walked by
  # its probe in a headless Chrome - which, with Node, the runner image has.
  sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install gd-chime for the web into every site
        run: python3 tooling/install_site.py

      - name: Check the framework and every site
        run: python3 tooling/check_site.py

      # A new site must pass its checks as create_site makes it, with no hand edits.
      - name: Check a freshly created site
        run: |
          python3 tooling/create_site.py ci_site
          python3 tooling/install_site.py ci_site
          python3 tooling/check_site.py ci_site
          rm -r sites/ci_site

      - name: Export sites
        run: python3 tooling/export_web.py

      - name: Upload sites
        uses: actions/upload-artifact@v7
        with:
          name: web-sites
          path: build/web
          if-no-files-found: error
          retention-days: 30

      - name: Upload sites for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  # The sites, live from main: https://<owner>.github.io/<repo>/<site>/.
  # The first run turns Pages on for the repository (enablement).
  pages:
    needs: sites
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
