#cloud-config
# For a provider with a "Cloud config" box when creating the server (Hetzner,
# for one): paste this whole file there. Elsewhere (Netcup), bootstrap.sh does
# the same from one command. Check two lines first: DOMAIN, whose api. name is the platform,
# and PLAY_DOMAIN, whose play. name is Lizarding's game server (the same
# domain will do). Both point at this machine, through Cloudflare.
#
# At first boot it fetches the factory's platform folder and runs setup.sh,
# which takes about ten minutes. Its log: /var/log/platform-setup.log

write_files:
  - path: /srv/platform/platform.env
    permissions: "0644"
    content: |
      DOMAIN=latent-sea.com
      PLAY_DOMAIN=lizarding.com

package_update: true
package_upgrade: true
packages:
  - git
  - curl

runcmd:
  - [bash, -c, "git clone --depth 1 https://github.com/latent-sea/godot-app-factory /srv/platform/factory && bash /srv/platform/factory/platform/setup.sh > /var/log/platform-setup.log 2>&1"]
